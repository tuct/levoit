# GENERATED-ish: hand-editable. See README.md in this folder.
# Ethernet instead of Wi-Fi: no wifi component at all. Catches sources that include
# esphome/components/wifi/* or touch wifi::global_wifi_component, which does not exist
# on wired boards. Pins are an Olimex ESP32-POE2 (WROVER-E, LAN8720, clock on GPIO0).
esphome:
  name: test-levoit-ethernet

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    pin: GPIO0
    mode: CLK_OUT
  phy_addr: 0
  power_pin: GPIO12

# Dummy key on purpose - these tests must build without a secrets.yaml.
api:
  encryption:
    key: "mfEv/h5ZAzrr46UQ/Mt35PpgcbVPFlPNhlLMZzAol4w="

external_components:
  - source: ../..
    components: [levoit]

uart:
  - id: uart_mcu
    tx_pin: GPIO4
    rx_pin: GPIO13
    baud_rate: 115200

levoit:
  id: dev
  model: VITAL100S
  uart_id: uart_mcu

fan:
  - platform: levoit
    levoit: dev
    name: "Fan"

#example levoit-superior-6000s-s3.yaml for a Seeed XIAO ESP32-S3 (local component)
# A replacement ESP on the MCU link; hold the stock module's EN low to disable it.
# On the LEH-S601S-WUS (stock ESP32-C3-SOLO-1) the MCU link is on module pins
# 27 (IO18, MCU TX) and 28 (IO19, MCU RX), confirmed on a device (discussion #78).
# Wire those to RX / TX below. Untested with a XIAO ESP32-S3 so far.
substitutions:
  device_name: levoit-superior-6000s-s3
  wifi_ap_ssid: "Levoit-Superior6000S"
  rx_pin: GPIO05  # XIAO ESP32-S3 pad D4 <- MCU TX (module pin 27)
  tx_pin: GPIO04  # XIAO ESP32-S3 pad D3 -> MCU RX (module pin 28)

esphome:
  name: ${device_name}

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

packages:
  common: !include common.yaml
  source: !include ../packages/source_local.yaml

# Generated from devices/levoit-superior-6000s/levoit-superior-6000s-c3.yaml by devices/make-builder-yaml.ps1 - in the
# repo, edit that file or its common.yaml and regenerate, not this one.
#example levoit-superior-6000s-c3.yaml for a Seeed XIAO ESP32-C3
# A replacement ESP on the MCU link; hold the stock module's EN low to disable it.
# On the LEH-S601S-WUS (stock ESP32-C3-SOLO-1) the MCU link is on module pins
# 27 (IO18, MCU TX) and 28 (IO19, MCU RX), confirmed on a device (discussion #78).
# Wire those to RX / TX below. Untested with a XIAO ESP32-C3 so far.
substitutions:
  device_name: levoit-superior-6000s-c3
  wifi_ap_ssid: "Levoit-Superior6000S"
  rx_pin: GPIO05  # XIAO ESP32-C3 pad D3 <- MCU TX (module pin 27)
  tx_pin: GPIO04  # XIAO ESP32-C3 pad D2 -> MCU RX (module pin 28)

esphome:
  name: ${device_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/tuct/levoit
      ref: stable
    components: [levoit]
    refresh: always
logger:
  level: DEBUG
  # GPIO18/19 (the C3's USB pins) carry the MCU link: log on UART0, the
  # module's programming pads, like the stock firmware
  hardware_uart: UART0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${wifi_ap_ssid}"
    password: !secret wifi_ap_password

captive_portal:

uart:
  - id: uart_mcu2esp
    tx_pin:
      number: ${tx_pin}
      inverted: false
    rx_pin:
      number: ${rx_pin}
      inverted: false
    baud_rate: 115200

levoit:
  id: levoitsuperior6000
  model: SUPERIOR6000S

# Fan speeds 1–9. Modes: Manual / Sleep / Auto / Humidity / Dry.
# Picking Dry applies whichever level the "Dry Level" select holds.
fan:
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Fan"
    id: levoit_fan1

switch:
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Display"
    type: display
    icon: mdi:brightness-7
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Child Lock"
    type: child_lock
    icon: mdi:lock-outline
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Auto Dry (Power Off)"
    type: auto_dry_power_off
    icon: mdi:fan-auto
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Auto Dry (Water Empty)"
    type: auto_dry_water_empty
    icon: mdi:fan-auto

number:
  # Hours, 0 = off. The ESP runs this countdown itself — see the README.
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Timer"
    type: timer
    icon: mdi:timer-outline
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Humidity Target"
    type: humidity_target
    icon: mdi:water-percent
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Filter Months"
    type: filter_lifetime_months

sensor:
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Humidity"
    type: humidity
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Temperature"
    type: temperature
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Filter Life (MCU)"
    type: filter_life_mcu
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Filter Life %"
    type: filter_life_left
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Timer Remaining"
    type: timer_current

select:
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Auto Profile"
    type: auto_profile
    icon: mdi:home-account
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Humidity Mode"
    type: humidity_subtype
    icon: mdi:water-percent
  # Remembered only — applied when Dry mode is selected on the fan entity.
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Dry Level"
    type: dry_level
    icon: mdi:air-filter

text_sensor:
  - platform: levoit
    levoit: levoitsuperior6000
    name: "MCU Version"
    type: mcu_version
  - platform: levoit
    levoit: levoitsuperior6000
    name: "ESP Version"
    type: esp_version
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Model"
    type: model

binary_sensor:
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Filter State"
    type: filter_low
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Cover State"
    type: cover_open
    icon: mdi:window-open
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Water Level"
    type: water_tank_empty
    icon: mdi:waves-arrow-up
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Drying"
    type: dry_active
    icon: mdi:air-filter
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Humidifying"
    type: humidifying
    icon: mdi:water

button:
  - platform: levoit
    levoit: levoitsuperior6000
    name: "Filter Reset"
    type: reset_filter_stats

# Philips Series 900 AC0950 — replacement ESP32-C3 on the MCU<->module UART.
#
# ⚠️ WIP — does not compile yet, see common.yaml. Nothing here is verified on
# hardware: pins, baud rate and the protocol itself are all still open.
substitutions:
  device_name: philips-ac0950
  wifi_ap_ssid: "Philips-AC0950"
  philips_model: AC0950
  rx_pin: GPIO20   # MCU TX -> ESP RX
  tx_pin: GPIO21   # ESP TX -> MCU RX

esphome:
  name: ${device_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

packages:
  common: !include common.yaml

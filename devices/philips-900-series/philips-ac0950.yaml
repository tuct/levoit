# Philips Series 900 AC0950 — replacement ESP32-C3 on the MCU<->module UART.
#
# ⚠️ The protocol and these pins are confirmed on an AC0951; the AC0950 (no PM
# sensor) has never been captured, so this variant is untested.
substitutions:
  device_name: philips-ac0950
  wifi_ap_ssid: "Philips-AC0950"
  philips_model: AC0950
  rx_pin: GPIO20   # XIAO C3 D7  — MCU TX (pad A) -> ESP RX
  tx_pin: GPIO10   # XIAO C3 D10 — ESP TX -> MCU RX (pad B)

esphome:
  name: ${device_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

packages:
  common: !include common.yaml

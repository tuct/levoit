# Philips Series 900 AC0951 C3 dev variant — AC0950 plus the PM sensor entities.
# The AC0951 reports PM2.5 and the allergen index on the MCU link exactly as the
# AC0651 does, and gains the Auto fan preset with them.
#
# ⚠️ The GPIO pins below are not yet verified on hardware.
substitutions:
  device_name: philips-ac0951-c3
  wifi_ap_ssid: "Philips-AC0951"
  philips_model: AC0951
  rx_pin: GPIO20   # XIAO C3 D7  — MCU TX (pad A) -> ESP RX
  tx_pin: GPIO10   # XIAO C3 D10 — ESP TX -> MCU RX (pad B)

esphome:
  name: ${device_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

packages:
  common: !include common.yaml

logger:
  level: DEBUG   # VERBOSE shows the raw UART frames (TX -> / RX <-)

# AC0951-only entities (added on top of common.yaml).
sensor:
  - platform: philips
    philips: purifier
    name: "PM2.5"
    type: pm2_5
  - platform: philips
    philips: purifier
    name: "Allergen Index"
    type: allergen_index

# Keeps the particulate sensor measuring while the unit is on standby, so PM2.5
# and the allergen index stay live with the fan off. Confirmed on the wire in
# captures/sensor_monitoring_on_off_on.txt (group 0x03 DP 0x34).
switch:
  - platform: philips
    philips: purifier
    name: "Standby Sensor Monitoring"
    type: standby_sensor

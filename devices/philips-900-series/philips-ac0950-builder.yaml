# Generated from devices/philips-900-series/philips-ac0950.yaml by devices/make-builder-yaml.ps1 - in the
# repo, edit that file or its common.yaml and regenerate, not this one.
# Philips Series 900 AC0950 — replacement ESP32-C3 on the MCU<->module UART.
#
# ⚠️ The protocol and these pins are confirmed on an AC0951; the AC0950 (no PM
# sensor) has never been captured, so this variant is untested.
substitutions:
  device_name: philips-ac0950
  wifi_ap_ssid: "Philips-AC0950"
  philips_model: AC0950
  rx_pin: GPIO20   # XIAO C3 D7  — MCU TX (pad A) -> ESP RX
  tx_pin: GPIO10   # XIAO C3 D10 — ESP TX -> MCU RX (pad B)

esphome:
  name: ${device_name}

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/tuct/levoit
      ref: stable
    components: [philips]
    refresh: always
logger:
  # On the ESP32-C3 the default logger UART (UART0) is GPIO20/21 — the same pins
  # as the MCU link. Log over the native USB instead so those pins stay free.
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${wifi_ap_ssid}"
    password: !secret wifi_ap_password

captive_portal:

uart:
  - id: uart_mcu
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    baud_rate: 115200   # confirmed by logic analyzer (86.4-86.6 us/byte)

philips:
  id: purifier
  model: ${philips_model}   # AC0950 / AC0951

fan:
  - platform: philips
    philips: purifier
    name: "Fan"

sensor:
  - platform: philips
    philips: purifier
    name: "Pre-filter"
    type: filter_clean
  - platform: philips
    philips: purifier
    name: "HEPA Filter"
    type: filter_lifetime
  - platform: philips
    philips: purifier
    name: "Timer Remaining"
    type: timer_remaining

# 900-series controls. The MCU mirrors brightness to DP 0x05 itself, and
# derives the timer countdown from the hours written here.
switch:
  - platform: philips
    philips: purifier
    name: "Child Lock"
    type: child_lock
  - platform: philips
    philips: purifier
    name: "Beep"
    type: beep

select:
  - platform: philips
    philips: purifier
    name: "Display Brightness"
    type: display_brightness

number:
  - platform: philips
    philips: purifier
    name: "Sleep Timer"
    type: timer

button:
  - platform: philips
    philips: purifier
    name: "Reset Pre-filter"
    type: reset_prefilter
  - platform: philips
    philips: purifier
    name: "Reset HEPA Filter"
    type: reset_hepa

text_sensor:
  - platform: philips
    philips: purifier
    name: "MCU Version"
    type: mcu_version

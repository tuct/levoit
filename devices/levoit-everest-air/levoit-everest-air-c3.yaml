# Example levoit-everest-air-c3.yaml for a replacement Seeed XIAO ESP32-C3.
# UART pins as wired on a tested unit: XIAO D4 (GPIO5) to TP82, D3 (GPIO6) to
# TP33. Check them against your own wiring, see this device's README
# "Wiring New ESP".
substitutions:
  device_name: levoit-everest-air-c3
  wifi_ap_ssid: "Levoit-EverestAir"
  rx_pin: GPIO05 #D4 TP82
  tx_pin: GPIO06 #D3 TP33

esphome:
  name: ${device_name}
  platformio_options:
    build_flags: -DBOARD_HAS_PSRAM
    board_build.arduino.memory_type: qio_opi
    board_build.f_flash: 80000000L
    board_build.flash_mode: qio

esp32:
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

packages:
  common: !include common.yaml
  source: !include ../packages/source_git.yaml

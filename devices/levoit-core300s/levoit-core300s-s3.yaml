#example levoit-core300s-s3.yaml for a Seeed XIAO ESP32-S3
substitutions:
  device_name: levoit-core300s-s3
  wifi_ap_ssid: "Levoit-Core300S"
  rx_pin: GPIO05  # XIAO ESP32-S3 pad D4
  tx_pin: GPIO04  # XIAO ESP32-S3 pad D3

esphome:
  name: ${device_name}

esp32:
  board: seeed_xiao_esp32s3
  framework:
    type: esp-idf

packages:
  common: !include common.yaml
  source: !include ../packages/source_git.yaml



#example levoit-vital200s-c6.yaml for flashing a new ESP32-C6
substitutions:
  device_name: levoit-vital200s-c6
  wifi_ap_ssid: "Levoit-Vital200S"
  rx_pin: GPIO17
  tx_pin: GPIO16

esphome:
  name: ${device_name}

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

packages:
  common: !include common.yaml
  source: !include ../packages/source_git.yaml


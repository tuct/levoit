#example levoit-vital200s.yaml for flashing the original ESP32-SOLO-1C
substitutions:
  device_name: levoit-vital200s
  wifi_ap_ssid: "Levoit-Vital200S"
  rx_pin: GPIO05
  tx_pin: GPIO06

esphome:
  name: ${device_name}
  min_version: 2026.6.0

esp32:
  board: esp32-c3-devkitm-1
  # Stock ESP32-C3-SOLO-1 module: DIO at default 80 MHz (matches stock firmware).
  flash_mode: dio
  framework:
    type: esp-idf
#    sdkconfig_options:
#      CONFIG_FREERTOS_UNICORE: y

packages:
  common: !include common.yaml
  source: !include ../packages/source_local.yaml

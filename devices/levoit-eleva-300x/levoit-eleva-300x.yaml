# Example levoit-eleva-300x.yaml for flashing the stock ESP32-C3 module of the Eleva 300X.
#
# The ESP ↔ MCU link is UART1 on GPIO18 (RX) / GPIO19 (TX), 115200 8N1, read from
# the stock firmware (module pads 27 / 28, the "IO16 / IO17" positions of the
# SOLO-1 footprint). GPIO18/19 are the C3's USB pins, so the log stays on J3;
# ESPHome's "GPIO18/19 is used by the USB-Serial-JTAG interface" warning is expected.
#
# Back up the stock firmware first (esptool read-flash 0 ALL); flash encryption
# and secure boot are disabled on this model, so the backup can be restored.
substitutions:
  device_name: levoit-eleva-300x
  wifi_ap_ssid: "Levoit-Eleva300X"
  rx_pin: GPIO18 # ESP RX <- MCU TX (module pad 27)
  tx_pin: GPIO19 # ESP TX -> MCU RX (module pad 28)

esphome:
  name: ${device_name}

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

# Keep the log on J3 (TXD0/RXD0), like the stock firmware
logger:
  hardware_uart: UART0

packages:
  common: !include common.yaml
  source: !include ../packages/source_git.yaml

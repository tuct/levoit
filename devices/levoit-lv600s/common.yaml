# Fixed-layout LV600S protocol; this package keeps the standalone model usable.
packages:
  network: !include network.yaml
  controls: !include
    file: lv600s-controls.yaml
    vars:
      lv600s_controls: '(*id(humidifier))'

uart:
  id: mcu_uart
  rx_pin: ${rx_pin}
  tx_pin: ${tx_pin}
  baud_rate: 9600
lv600s_humidifier:
  id: humidifier
  uart_id: mcu_uart
  model: LV600S
  current_humidity:
    name: Humidity
  current_temperature:
    name: Temperature
  target_humidity:
    name: Target Humidity Reported
  water_lacks:
    name: Water Tank Empty
    icon: mdi:water-off
  tank_removed:
    name: Tank Removed
  humidifying:
    name: Humidifying
    icon: mdi:scent
  warm_enabled:
    name: Heating Enabled
    icon: mdi:heat-wave
  online:
    name: MCU Connection
  fault:
    name: MCU Fault
  other_exception:
    name: MCU Fault Raw
  fault_message:
    name: Error
  command_result:
    name: Command Result
  mcu_version:
    name: MCU Version
  esp_version:
    name: ESP Version
  model_sensor:
    name: Model

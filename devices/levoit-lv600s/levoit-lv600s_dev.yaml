# LUH-A602S-WEUR: original ESP32-SOLO-1C, 4 MB. Verify your board before flashing.
substitutions:
  device_name: levoit-lv600s
  wifi_ap_ssid: Levoit LV600S Setup
  rx_pin: GPIO16
  tx_pin: GPIO17

esphome:
  name: ${device_name}
  project:
    name: tuct.levoit_lv600s
    version: "1.2.09-target-preset-startup"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y

packages:
  common: !include common.yaml

external_components:
  - source: ../../components
    components: [lv600s_humidifier]

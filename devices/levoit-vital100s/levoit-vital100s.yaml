#example levoit-vital100s.yaml for flashing the original ESP32-C3-SOLO-1
substitutions:
  device_name: levoit-vital100s
  wifi_ap_ssid: "Levoit-Vital100S"
  rx_pin: GPIO018
  tx_pin: GPIO019

esphome:
  name: ${device_name}
  min_version: 2026.6.0

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  # Stock ESP32-C3-SOLO-1 module: DIO at default 80 MHz (matches stock firmware).
  flash_mode: dio
  cpu_frequency: 160Mhz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y

packages:
  common: !include common.yaml
  source: !include ../packages/source_git.yaml









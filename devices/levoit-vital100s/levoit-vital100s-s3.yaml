#example levoit-vital100s-s3.yaml for flashing a new ESP32-S3
substitutions:
  device_name: levoit-vital100s-s3
  wifi_ap_ssid: "Levoit-Vital100S"
  rx_pin: GPIO05
  tx_pin: GPIO06

esphome:
  name: ${device_name}

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

packages:
  common: !include common.yaml
  source: !include ../packages/source_git.yaml

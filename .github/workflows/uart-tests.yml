name: UART host regressions
on:
  pull_request:
    paths: ['components/levoit/**', '.github/workflows/uart-tests.yml']
  push:
    branches: [main]
jobs:
  uart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python components/levoit/tests/test_uart_integrity.py

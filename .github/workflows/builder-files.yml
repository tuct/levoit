name: Builder files

# The devices/*/*-builder*.yaml files are what users paste into the ESPHome
# Device Builder. Check that they match their device yaml / common.yaml
# (devices/make-builder-yaml.ps1) and that they build against the components
# in this checkout.
#
# Only what a change can break is built (.github/scripts/builder_ci_matrix.py):
# a PR that touches devices/<x>/ builds <x>'s builder files, one that touches
# components/ or .github/ builds all of them; main and manual runs build all.
# The files are built in groups of up to five per job, so the ESP-IDF set-up
# (~45 s) happens once per group and a PR takes a few job slots instead of 25.
on:
  pull_request:
    paths:
      - 'devices/**'
      - 'components/**'
      - '.github/scripts/builder_ci_config.py'
      - '.github/scripts/builder_ci_matrix.py'
      - '.github/workflows/builder-files.yml'
  push:
    branches: [main]
    paths:
      - 'devices/**'
      - 'components/**'
      - '.github/scripts/builder_ci_config.py'
      - '.github/scripts/builder_ci_matrix.py'
      - '.github/workflows/builder-files.yml'
  workflow_dispatch:

# A new push to the same PR cancels the previous run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  up-to-date:
    name: builder files up to date
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate and compare
        shell: pwsh
        run: ./devices/make-builder-yaml.ps1 -Check

      - name: Builder files to build
        id: list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA"...HEAD > "$RUNNER_TEMP/changed.txt"
            echo "Changed files:"; cat "$RUNNER_TEMP/changed.txt"
            groups="$(python3 .github/scripts/builder_ci_matrix.py < "$RUNNER_TEMP/changed.txt")"
          else
            groups="$(python3 .github/scripts/builder_ci_matrix.py --all)"
          fi
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "$groups" | python3 -c "import json,sys; [print(g['name'], '->', g['files']) for g in json.load(sys.stdin)] or print('nothing to build')"

  compile:
    name: ${{ matrix.group.name }}
    needs: up-to-date
    if: needs.up-to-date.outputs.groups != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.up-to-date.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # No cache for ESP-IDF (~/.cache/esphome/idf): with its toolchains it is
      # 3-4 GB, restoring it takes about as long as the ~45 s set-up, and a few
      # such entries fill GitHub's 10 GB per repo. Grouping pays the set-up
      # once per group instead.
      - name: Install ESPHome
        run: |
          pip install esphome
          esphome version

      - name: esphome compile
        run: |
          failed=()
          for file in ${{ matrix.group.files }}; do
            echo "::group::$file"
            name="$(basename "$file")"
            dir="$RUNNER_TEMP/builder"
            if python .github/scripts/builder_ci_config.py "$file" "$dir" \
               && (cd "$dir" && esphome compile "$name"); then
              echo "$file: ok"
            else
              failed+=("$file")
              echo "::error file=$file::esphome compile failed"
            fi
            # free the disk for the next one
            rm -rf "$dir/.esphome/build"
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi

name: Host tests

# Builds the ESPHome-free part of components/levoit with a plain g++ and runs
# its checks (tests/host). It fails when one of those files starts depending
# on ESPHome again. See docs/shared-core.md.
on:
  pull_request:
    paths:
      - 'components/levoit/**'
      - 'tests/host/**'
      - 'devices/levoit-lv600s/uart/*.csv'
      - '.github/workflows/host-tests.yml'
  push:
    branches: [main]
    paths:
      - 'components/levoit/**'
      - 'tests/host/**'
      - 'devices/levoit-lv600s/uart/*.csv'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  levoit-frame:
    name: levoit frame layer without ESPHome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          g++ -std=c++17 -Wall -Wextra \
            tests/host/levoit_frame_test.cpp \
            components/levoit/tlv.cpp \
            components/levoit/levoit_message.cpp \
            -o /tmp/levoit-frame-test
          /tmp/levoit-frame-test
          g++ -std=c++17 -Wall -Wextra \
            tests/host/levoit_state_test.cpp \
            -o /tmp/levoit-state-test
          /tmp/levoit-state-test
          # The whole protocol core: LevoitDevice, the decoders and builders
          # of every model, driven through a fake platform and host.
          g++ -std=c++17 -Wall -Wextra -DLEVOIT_HOST_QUIET \
            tests/host/levoit_device_test.cpp \
            components/levoit/levoit_device.cpp \
            components/levoit/decoder.cpp \
            components/levoit/core_status.cpp \
            components/levoit/vital_status.cpp \
            components/levoit/sprout_status.cpp \
            components/levoit/superior_status.cpp \
            components/levoit/lv600s_status.cpp \
            components/levoit/core_commands.cpp \
            components/levoit/vital_commands.cpp \
            components/levoit/sprout_commands.cpp \
            components/levoit/superior_commands.cpp \
            components/levoit/tlv.cpp \
            components/levoit/levoit_message.cpp \
            -o /tmp/levoit-device-test
          /tmp/levoit-device-test
